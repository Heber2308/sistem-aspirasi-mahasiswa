<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Sistem Aspirasi Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-top: 50px;
            margin-bottom: 50px;
        }
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .register-header h3 {
            color: #333;
            margin-top: 15px;
        }
        .register-header i {
            font-size: 3rem;
            color: #667eea;
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-register:hover {
            transform: scale(1.02);
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.25);
        }
        .password-hint {
            font-size: 0.75rem;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="register-card">
                    <div class="register-header">
                        <i class="fas fa-user-plus"></i>
                        <h3>Daftar Akun Baru</h3>
                        <p class="text-muted">Isi data diri Anda dengan lengkap</p>
                    </div>
                    
                    {% if error %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-circle"></i> {{ error }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endif %}
                    
                    {% if success %}
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="fas fa-check-circle"></i> {{ success }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endif %}
                    
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label><i class="fas fa-id-card"></i> NIM</label>
                                <input type="text" name="nim" class="form-control" placeholder="Contoh: 2303310001" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label><i class="fas fa-user"></i> Nama Lengkap</label>
                                <input type="text" name="nama" class="form-control" placeholder="Nama lengkap" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label><i class="fas fa-envelope"></i> Email</label>
                            <input type="email" name="email" class="form-control" placeholder="email@kampus.ac.id" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label><i class="fas fa-university"></i> Fakultas</label>
                                <input type="text" name="fakultas" class="form-control" placeholder="Contoh: FTIK" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label><i class="fas fa-book"></i> Program Studi</label>
                                <input type="text" name="prodi" class="form-control" placeholder="Contoh: Informatika" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label><i class="fas fa-lock"></i> Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Minimal 6 karakter" required>
                            <div class="password-hint">Password minimal 6 karakter, gunakan kombinasi huruf dan angka</div>
                        </div>
                        <button type="submit" class="btn btn-register">
                            <i class="fas fa-check-circle"></i> Daftar
                        </button>
                    </form>
                    
                    <div class="login-link">
                        <p>Sudah punya akun? <a href="/login">Login sekarang</a></p>
                        <p><a href="/">← Kembali ke Beranda</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
